[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsrc"
version = "0.2.0"
description = "Prompt-as-Source Toolkit: schema + semantic versioning + semantic truncation + MCP intent bridge for agent prompts. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shanlun" }]
keywords = ["prompt", "agent", "mcp", "semver", "llm", "prompt-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
include = ["agentsrc*"]
